<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calculadora de frente de parrilla</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#24272B">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<style>
  :root{
    --bg: #24272B;
    --panel: #2E3237;
    --panel-2: #383D43;
    --line: #454B52;
    --text: #EDEAE3;
    --text-dim: #A7ADB4;
    --ember: #D9762B;
    --ember-dim: #8C5527;
    --steel: #5B7A93;
    --ok: #7BAE7F;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif;
  }
  .wrap {
    max-width: 640px;
    margin: 0 auto;
    padding: 18px 14px 110px;
  }
  header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    border-bottom: 2px solid var(--ember);
    padding-bottom: 10px;
    margin-bottom: 18px;
  }
  header .titles { display: flex; flex-direction: column; }
  header h1 {
    font-family: 'Oswald', 'Segoe UI', sans-serif;
    font-size: 1.3rem;
    letter-spacing: 0.02em;
    margin: 0;
    text-transform: uppercase;
  }
  header span { font-size: 0.8rem; color: var(--text-dim); }
  header .logo {
    width: 42px;
    height: 42px;
    border-radius: 50%;
    object-fit: cover;
    border: 1px solid var(--line);
    flex-shrink: 0;
    margin-left: 10px;
  }
  .section {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 4px;
    margin-bottom: 14px;
    overflow: hidden;
  }
  .section-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    min-height: 48px;
    padding: 12px 14px;
    background: var(--panel-2);
    cursor: pointer;
    user-select: none;
  }
  .section-head h2 {
    font-family: 'Oswald', 'Segoe UI', sans-serif;
    font-size: 0.95rem;
    letter-spacing: 0.03em;
    text-transform: uppercase;
    margin: 0;
    color: var(--text-dim);
  }
  .chevron { transition: transform 0.15s ease; color: var(--text-dim); font-size: 0.8rem; }
  .chevron.open { transform: rotate(90deg); }
  .section-body {
    padding: 12px 14px 14px;
    display: none;
  }
  .section-body.open { display: block; }
  .valores-grid {
    display: grid;
    grid-template-columns: 1fr 130px;
    gap: 8px 10px;
    align-items: center;
    margin-bottom: 6px;
  }
  .valores-grid label {
    font-size: 0.9rem;
    color: var(--text-dim);
  }
  .valores-grid input {
    width: 100%;
  }
  .template-block-title {
    font-family: 'Oswald', 'Segoe UI', sans-serif;
    font-size: 0.9rem;
    letter-spacing: 0.03em;
    text-transform: uppercase;
    color: var(--ember);
    margin: 14px 0 6px;
  }
  .template-block-title:first-child { margin-top: 0; }
  .subgroup-title {
    grid-column: 1 / -1;
    font-size: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--text-dim);
    margin-top: 8px;
    padding-top: 8px;
    border-top: 1px dashed var(--line);
  }
  .subgroup-title:first-child { border-top: none; margin-top: 0; padding-top: 0; }

  input[type=text], input[type=email] {
    background: var(--bg);
    border: 1px solid var(--line);
    color: var(--text);
    padding: 10px;
    border-radius: 3px;
    /* 16px o más: evita que el iPhone haga zoom al tocar un campo */
    font-size: 16px;
    min-height: 44px;
  }
  input[type=text]:focus, input[type=email]:focus, select:focus {
    outline: none;
    border-color: var(--ember);
  }
  select {
    background: var(--bg);
    border: 1px solid var(--line);
    color: var(--text);
    padding: 10px;
    border-radius: 3px;
    font-size: 16px;
    min-height: 44px;
  }

  .frente-card {
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-left: 3px solid var(--steel);
    border-radius: 3px;
    padding: 12px;
    margin-bottom: 10px;
  }
  .frente-top {
    display: flex;
    gap: 8px;
    margin-bottom: 10px;
    align-items: center;
  }
  .frente-top input[type=text] {
    flex: 1;
  }
  .btn-del {
    background: transparent;
    border: 1px solid var(--line);
    color: var(--text-dim);
    border-radius: 3px;
    width: 44px;
    height: 44px;
    font-size: 1rem;
    cursor: pointer;
    flex-shrink: 0;
  }
  .btn-del:active { border-color: var(--ember); color: var(--ember); }

  .tpl-row { margin-bottom: 10px; }
  .tpl-row select { width: 100%; }

  .medidas-row, .cant-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 8px;
    margin-bottom: 8px;
  }
  .field label {
    display: block;
    font-size: 0.75rem;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 0.03em;
    margin-bottom: 4px;
  }
  .field input, .field select { width: 100%; }

  .frente-total {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-top: 10px;
    padding-top: 10px;
    border-top: 1px dashed var(--line);
  }
  .frente-total .label { font-size: 0.85rem; color: var(--text-dim); }
  .frente-total .val { font-family: 'Oswald', sans-serif; font-size: 1.05rem; color: var(--ember); }

  .btn-add-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; }
  .btn-add {
    flex: 1;
    display: block;
    background: transparent;
    border: 1px dashed var(--steel);
    color: var(--steel);
    min-width: 120px;
    min-height: 44px;
    padding: 10px;
    border-radius: 3px;
    font-size: 0.9rem;
    cursor: pointer;
  }
  .btn-add:active { border-color: var(--ember); color: var(--ember); }

  .total-bar {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    background: var(--panel-2);
    border-top: 2px solid var(--ember);
    padding: 12px 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .total-bar .lbl {
    font-size: 0.78rem;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }
  .total-bar .amt-wrap { display: flex; flex-direction: column; align-items: flex-end; }
  .total-bar .gan { font-size: 0.78rem; color: var(--ok); }
  .total-bar .amt {
    font-family: 'Oswald', sans-serif;
    font-size: 1.5rem;
    color: var(--ember);
  }
  .desglose {
    font-size: 0.85rem;
    color: var(--text-dim);
    margin-top: 8px;
    line-height: 1.7;
    border-top: 1px dashed var(--line);
    padding-top: 8px;
  }
  .desglose b { color: var(--text); }
  .desglose-toggle {
    display: inline-block;
    font-size: 0.85rem;
    color: var(--steel);
    margin-top: 4px;
    padding: 8px 0;
    cursor: pointer;
    user-select: none;
  }
  .desglose-toggle:active { color: var(--ember); }

  .field.full { margin-bottom: 10px; }
  .btn-pdf {
    display: block;
    width: 100%;
    background: var(--ember-dim);
    border: 1px solid var(--ember);
    color: var(--text);
    padding: 12px;
    min-height: 48px;
    border-radius: 3px;
    font-size: 1rem;
    cursor: pointer;
  }
  .btn-pdf:active { background: var(--ember); }
  .btn-wa {
    display: block;
    width: 100%;
    margin-top: 10px;
    background: #1f6f43;
    border: 1px solid #25D366;
    color: var(--text);
    padding: 12px;
    min-height: 48px;
    border-radius: 3px;
    font-size: 1rem;
    cursor: pointer;
  }
  .btn-wa:active { background: #25D366; }
  .agenda {
    margin-top: 16px;
    padding-top: 12px;
    border-top: 1px dashed var(--line);
  }
  .agenda-title { font-size: 0.85rem; color: var(--text-dim); margin-bottom: 8px; }
  .agenda-row { display: grid; grid-template-columns: 1fr 110px; gap: 8px; }
  .agenda-row input {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--line);
    color: var(--text);
    padding: 10px;
    min-height: 44px;
    border-radius: 3px;
    font-size: 16px;
    color-scheme: dark;
  }
  .btn-sec {
    display: block;
    width: 100%;
    margin-top: 10px;
    background: transparent;
    border: 1px solid var(--line);
    color: var(--text-dim);
    padding: 10px;
    min-height: 44px;
    border-radius: 3px;
    font-size: 0.9rem;
    cursor: pointer;
  }
  .btn-sec:active { border-color: var(--ember); color: var(--ember); }
  .config-title {
    font-family: 'Oswald', 'Segoe UI', sans-serif;
    font-size: 0.8rem;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: var(--text-dim);
    margin: 26px 0 8px;
  }
  .pdf-msg { font-size: 0.85rem; color: var(--text-dim); margin-top: 8px; min-height: 1em; }

  .hist-toggle-row {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 0.9rem;
    color: var(--text-dim);
    margin-bottom: 10px;
    padding: 6px 0;
    cursor: pointer;
  }
  .hist-toggle-row input { width: 22px; height: 22px; flex-shrink: 0; accent-color: var(--ember); }
  .hist-item {
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-left: 3px solid var(--ember-dim);
    border-radius: 3px;
    padding: 10px 12px;
    margin-bottom: 8px;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    flex-wrap: wrap;
    gap: 8px;
  }
  .hist-item.aceptado { border-left-color: var(--ok); }
  .hist-item.rechazado { border-left-color: var(--line); opacity: 0.7; }
  .hist-item .info { flex: 1; min-width: 0; cursor: pointer; }
  .hist-estado {
    display: inline-block;
    font-size: 0.72rem;
    padding: 2px 8px;
    border-radius: 10px;
    margin-top: 6px;
    background: var(--bg);
    color: var(--text-dim);
  }
  .hist-item.aceptado .hist-estado { color: var(--ok); }
  .hist-panel {
    flex-basis: 100%;
    border-top: 1px dashed var(--line);
    padding-top: 10px;
    margin-top: 4px;
  }
  .hist-acciones { display: flex; gap: 8px; }
  .hist-acciones button {
    flex: 1;
    min-height: 44px;
    background: transparent;
    border: 1px solid var(--line);
    color: var(--text);
    border-radius: 3px;
    font-size: 0.9rem;
    cursor: pointer;
  }
  .hist-acciones button.on-ok { border-color: var(--ok); color: var(--ok); }
  .hist-acciones button.on-no { border-color: var(--ember); color: var(--ember); }
  .hist-entrega { margin-top: 10px; font-size: 0.85rem; color: var(--text-dim); }
  .hist-entrega input {
    width: 100%;
    margin: 6px 0 0;
    background: var(--bg);
    border: 1px solid var(--line);
    color: var(--text);
    padding: 10px;
    min-height: 44px;
    border-radius: 3px;
    font-size: 16px;
    color-scheme: dark;
  }
  .hist-item .cliente { font-size: 0.95rem; color: var(--text); }
  .hist-item .meta { font-size: 0.78rem; color: var(--text-dim); margin-top: 2px; }
  .hist-item .total { font-family: 'Oswald', sans-serif; font-size: 0.95rem; color: var(--ember); white-space: nowrap; }
  .hist-empty { font-size: 0.85rem; color: var(--text-dim); padding: 8px 0; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="titles">
      <h1>Frente de parrilla</h1>
      <span>calculadora</span>
    </div>
    <img class="logo" src="logo.png" alt="Diseño &amp; Alma">
  </header>

  <div class="section" id="sec-frentes">
    <div class="section-head" onclick="toggleSection('sec-frentes')">
      <h2>Frentes cargados</h2>
      <span class="chevron open" id="chev-sec-frentes">▶</span>
    </div>
    <div class="section-body open" id="body-sec-frentes">
      <div id="frentes-list"></div>
      <div class="btn-add-row">
        <button class="btn-add" onclick="agregarFrente('frente')">+ Frente de parrilla</button>
        <button class="btn-add" onclick="agregarFrente('bajomesada')">+ Bajo mesada</button>
        <button class="btn-add" onclick="agregarFrente('parrillamodular')">+ Parrilla Modular</button>
      </div>
    </div>
  </div>

  <div class="section" id="sec-pdf">
    <div class="section-head" onclick="toggleSection('sec-pdf')">
      <h2>Generar presupuesto (PDF)</h2>
      <span class="chevron open" id="chev-sec-pdf">▶</span>
    </div>
    <div class="section-body open" id="body-sec-pdf">
      <div class="field full"><label>Cliente (opcional)</label><input type="text" id="pdf-cliente" placeholder="Nombre del cliente" oninput="guardarBorrador()"></div>
      <div class="field full"><label>Email del cliente (opcional)</label><input type="email" id="pdf-email" inputmode="email" autocomplete="off" placeholder="cliente@ejemplo.com" oninput="guardarBorrador()"></div>
      <div class="field full"><label>WhatsApp del cliente (opcional)</label><input type="text" id="pdf-tel" inputmode="tel" autocomplete="off" placeholder="11 2345 6789" oninput="guardarBorrador()"></div>
      <button class="btn-pdf" onclick="generarPDF()">Generar PDF para el cliente</button>
      <button class="btn-wa" onclick="enviarWhatsApp()">Enviar por WhatsApp</button>
      <div class="pdf-msg" id="pdf-msg"></div>
      <div class="agenda">
        <div class="agenda-title">¿Aceptó el presupuesto? Agendá la instalación:</div>
        <div class="agenda-row">
          <input type="date" id="inst-fecha">
          <input type="time" id="inst-hora" value="09:00">
        </div>
        <button class="btn-sec" onclick="agendarInstalacion()">Agendar en Google Calendar</button>
      </div>
      <button class="btn-sec" onclick="nuevoPresupuesto()">Empezar un presupuesto nuevo</button>
    </div>
  </div>

  <div class="section" id="sec-historial">
    <div class="section-head" onclick="toggleSection('sec-historial')">
      <h2>Historial</h2>
      <span class="chevron" id="chev-sec-historial">▶</span>
    </div>
    <div class="section-body" id="body-sec-historial">
      <label class="hist-toggle-row">
        <input type="checkbox" id="hist-enabled" onchange="onHistToggle(this.checked)">
        Guardar en este celular cada presupuesto que genere
      </label>
      <div id="historial-list"></div>
    </div>
  </div>

  <div class="config-title">Configuración</div>
  <div class="section" id="sec-valores">
    <div class="section-head" onclick="toggleSection('sec-valores')">
      <h2>Valores base</h2>
      <span class="chevron" id="chev-sec-valores">▶</span>
    </div>
    <div class="section-body" id="body-sec-valores">
      <div id="valores-container"></div>
      <button class="btn-sec" onclick="restaurarValoresBase()">Volver a los precios originales</button>
      <div class="field full" style="margin-top:14px"><label>Próximo N° de presupuesto</label><input type="text" inputmode="numeric" id="nro-proximo" oninput="guardarProximoNumero(this.value)"></div>
    </div>
  </div>

  <div class="section" id="sec-sheets">
    <div class="section-head" onclick="toggleSection('sec-sheets')">
      <h2>Conexión con Google Sheets</h2>
      <span class="chevron" id="chev-sec-sheets">▶</span>
    </div>
    <div class="section-body" id="body-sec-sheets">
      <label class="hist-toggle-row">
        <input type="checkbox" id="sheets-enabled" onchange="onSheetsToggle(this.checked)">
        Registrar cada presupuesto en mi Google Sheet
      </label>
      <div class="field full"><label>URL del Web App de Sheets</label><input type="text" id="sheets-url" placeholder="https://script.google.com/macros/s/..." oninput="guardarSheetsUrl(this.value)"></div>
      <div class="pdf-msg" id="sheets-msg"></div>
    </div>
  </div>

</div>

<div class="total-bar">
  <span class="lbl">Total</span>
  <span class="amt-wrap">
    <span class="amt" id="total-general">$0</span>
    <span class="gan" id="ganancia-general"></span>
  </span>
</div>

<script>
// ---------- Config de plantillas ----------
const TEMPLATES = {
  frente: {
    label: 'Frente de Parrilla',
    specs: [
      'Chapa N°18',
      'Puerta guillotina con aislante térmico y doble chapa, apertura hacia arriba o hacia abajo según su preferencia',
      'Cubre losa de acero inoxidable',
      'Manijón de acero inoxidable',
      'Puertas con bisagras de cierre suave',
      'Terminación con pintura horno'
    ],
    perM2: [
      { key:'valor1', label:'Chapa y plegado', def:185000 },
      { key:'valor2', label:'Pintura', def:52000 },
    ],
    perUnit: [
      { key:'bisagra', label:'Bisagra', def:20000, qty:'bisagras' },
      { key:'kit', label:'Kit', def:170000, qty:'kit' },
      { key:'carbonero', label:'Carbonero', def:250000, qty:'carbonero' },
      { key:'cubiertero', label:'Cubiertero', def:180000, qty:'cubiertero' },
    ],
    fixed: [
      { key:'comision', label:'Comisión', def:70000 },
      { key:'logistica', label:'Logística', def:120000 },
      { key:'manoobra', label:'Mano de obra', def:450000 },
      { key:'gastotaller', label:'Gasto taller', def:70000 },
    ],
    // Porcentaje sobre el total de costos (sin carbonero ni cubiertero, que son
    // agregados a precio fijo). Se suma al precio, pero el renglón sólo se ve
    // en la app (el PDF muestra el precio final de cada ítem).
    ganancia: { label:'Ganancia real', defPct:19 }
  },
  bajomesada: {
    label: 'Bajo Mesada',
    specs: [
      'Estructura en chapa N°18',
      'Puertas con bisagras de cierre suave',
      'Terminación con pintura horno'
    ],
    perM2: [
      { key:'valor1', label:'Chapa', def:150000 },
      { key:'valor2', label:'Pintura', def:42000 },
    ],
    perUnit: [
      { key:'bisagra', label:'Bisagra', def:15000, qty:'bisagras' },
      { key:'kit', label:'Kit', def:10000, qty:'kit' },
      { key:'carbonero', label:'Carbonero', def:250000, qty:'carbonero' },
      { key:'cubiertero', label:'Cubiertero', def:180000, qty:'cubiertero' },
    ],
    fixed: [
      { key:'manoobra', label:'Mano de obra e instalación', def:180000 },
    ],
    ganancia: { label:'Ganancia real', defPct:19 }
  },
  parrillamodular: {
    label: 'Parrilla Modular',
    specs: [
      'Parrilla en módulo',
      'Bastidor de parrilla en caño 40x20',
      'Hierro redondo de 10mm o hierro en V con gracero',
      'Módulos desmontables',
      'Parrilla enlozada',
      'Sistema de elevación frontal',
      'Chapa chispero',
      'Fogonero incluido'
    ],
    perM2: [],
    perUnit: [],
    fixed: [],
    opciones: [
      { label:'De 1,00 hasta 1,30 m', valor:980000 },
      { label:'De 1,31 hasta 1,60 m', valor:1100000 },
      { label:'De 1,61 hasta 2,00 m', valor:1250000 },
    ]
  }
};

// Subir este número cuando cambien los precios por defecto de TEMPLATES:
// así los celulares dejan de usar los precios viejos que tenían guardados.
const VERSION_PRECIOS = 2;

let frentes = [];
let nextId = 1;

function toggleSection(id){
  document.getElementById('body-'+id).classList.toggle('open');
  document.getElementById('chev-'+id).classList.toggle('open');
}

function fmt(n){
  return '$' + Math.round(n).toLocaleString('es-AR');
}

// Medidas y cantidades: acepta coma o punto como decimal ("1,50" o "1.50").
function num(v){
  return parseFloat(String(v == null ? '' : v).replace(/\s/g,'').replace(',', '.')) || 0;
}
// Precios: son pesos enteros, así que se ignoran puntos y comas de miles ("175.000").
function precio(v){
  return parseInt(String(v == null ? '' : v).replace(/[^0-9]/g,''), 10) || 0;
}
function mostrarNum(n){
  return n ? String(n).replace('.', ',') : '';
}

function val(id){
  const el = document.getElementById(id);
  return el ? precio(el.value) : 0;
}

// ---------- Guardado en el dispositivo (precios y presupuesto en curso) ----------
function leerLS(clave){
  try{ const raw = localStorage.getItem(clave); return raw ? JSON.parse(raw) : null; }catch(e){ return null; }
}
function escribirLS(clave, valor){
  try{ localStorage.setItem(clave, JSON.stringify(valor)); }catch(e){}
}

function guardarValoresBase(){
  const valores = {};
  document.querySelectorAll('#valores-container input').forEach(inp => { valores[inp.id] = precio(inp.value); });
  escribirLS('valores-base', valores);
}

function restaurarValoresBase(){
  if (!confirm('¿Volver todos los precios a los valores originales?')) return;
  try{ localStorage.removeItem('valores-base'); }catch(e){}
  buildValoresBaseHTML();
  calcularTotales();
}

function guardarBorrador(){
  escribirLS('borrador', {
    frentes, nextId,
    cliente: document.getElementById('pdf-cliente').value,
    email: document.getElementById('pdf-email').value,
    tel: document.getElementById('pdf-tel').value
  });
}

function cargarBorrador(){
  const b = leerLS('borrador');
  if (!b || !Array.isArray(b.frentes) || !b.frentes.length) return false;
  frentes = b.frentes.filter(f => TEMPLATES[f.template]);
  if (!frentes.length) return false;
  nextId = Math.max(b.nextId || 1, ...frentes.map(f => f.id + 1));
  document.getElementById('pdf-cliente').value = b.cliente || '';
  document.getElementById('pdf-email').value = b.email || '';
  document.getElementById('pdf-tel').value = b.tel || '';
  render();
  return true;
}

function nuevoPresupuesto(){
  if (!confirm('¿Borrar los ítems y el cliente cargados y empezar de cero? Los precios base no se tocan.')) return;
  frentes = [];
  nextId = 1;
  document.getElementById('pdf-cliente').value = '';
  document.getElementById('pdf-email').value = '';
  document.getElementById('pdf-tel').value = '';
  document.getElementById('inst-fecha').value = '';
  document.getElementById('pdf-msg').textContent = '';
  agregarFrente('frente');
}

// ---------- Construir "Valores base" dinámicamente a partir de TEMPLATES ----------
function buildValoresBaseHTML(){
  let html = '';
  Object.keys(TEMPLATES).forEach(tkey => {
    const t = TEMPLATES[tkey];
    html += `<div class="template-block-title">${t.label}</div><div class="valores-grid">`;
    if (t.opciones){
      html += `<div class="subgroup-title">Opciones (precio por rango de medida)</div>`;
      t.opciones.forEach((op, i) => {
        html += `<label>${op.label}</label><input type="text" inputmode="numeric" id="v_${tkey}_opcion${i}" value="${op.valor}">`;
      });
      html += `</div>`;
      return;
    }
    html += `<div class="subgroup-title">Por m²</div>`;
    t.perM2.forEach(it => {
      html += `<label>${it.label}</label><input type="text" inputmode="numeric" id="v_${tkey}_${it.key}" value="${it.def}">`;
    });
    html += `<div class="subgroup-title">Por unidad</div>`;
    t.perUnit.forEach(it => {
      html += `<label>${it.label}</label><input type="text" inputmode="numeric" id="v_${tkey}_${it.key}" value="${it.def}">`;
    });
    html += `<div class="subgroup-title">Fijos (por frente)</div>`;
    t.fixed.forEach(it => {
      html += `<label>${it.label}</label><input type="text" inputmode="numeric" id="v_${tkey}_${it.key}" value="${it.def}">`;
    });
    if (t.ganancia){
      html += `<label>${t.ganancia.label} (% sobre el total, no sale en el PDF)</label><input type="text" inputmode="numeric" id="v_${tkey}_ganancia" value="${t.ganancia.defPct}">`;
    }
    html += `</div>`;
  });
  document.getElementById('valores-container').innerHTML = html;
  if (leerLS('valores-base-version') !== VERSION_PRECIOS){
    try{ localStorage.removeItem('valores-base'); }catch(e){}
    escribirLS('valores-base-version', VERSION_PRECIOS);
  }
  const guardados = leerLS('valores-base') || {};
  document.querySelectorAll('#valores-container input').forEach(inp => {
    if (guardados[inp.id] != null) inp.value = guardados[inp.id];
    inp.addEventListener('input', () => { calcularTotales(); guardarValoresBase(); });
  });
}

function agregarFrente(template){
  frentes.push({
    id: nextId++,
    desc: TEMPLATES[template].label + ' ' + nextId,
    template: template,
    ancho: 0, alto: 0,
    bisagras: 0, kit: 0, carbonero: 0, cubiertero: 0,
    opcion: 0
  });
  render();
}

function eliminarFrente(id){
  const f = frentes.find(f => f.id === id);
  if (!f || !confirm('¿Borrar "' + (f.desc || 'este ítem') + '"?')) return;
  frentes = frentes.filter(f => f.id !== id);
  render();
}

function actualizarFrente(id, campo, valor){
  const f = frentes.find(f => f.id === id);
  if (!f) return;
  f[campo] = campo === 'desc' ? valor : num(valor);
  calcularTotales();
}

function cambiarTemplate(id, nuevoTemplate){
  const f = frentes.find(f => f.id === id);
  if (!f) return;
  f.template = nuevoTemplate;
  render();
}

function calcularFrente(f){
  const t = TEMPLATES[f.template] || TEMPLATES.frente;

  if (t.opciones){
    const idx = f.opcion || 0;
    const opt = t.opciones[idx] || t.opciones[0];
    const v = val('v_'+f.template+'_opcion'+idx) || opt.valor;
    return { area: 0, items: [{ label: opt.label, value: v }], total: v };
  }

  const area = (f.ancho||0) * (f.alto||0);
  let total = 0;
  const items = [];
  t.perM2.forEach(it => {
    const v = val('v_'+f.template+'_'+it.key);
    const sub = area * v;
    items.push({ label: it.label, value: sub });
    total += sub;
  });
  // Carbonero y cubiertero son agregados a precio fijo: no llevan ganancia.
  let sinGanancia = 0;
  t.perUnit.forEach(it => {
    const qty = f[it.qty] || 0;
    const v = val('v_'+f.template+'_'+it.key);
    const sub = qty * v;
    items.push({ label: it.label, value: sub });
    total += sub;
    if (it.key === 'carbonero' || it.key === 'cubiertero') sinGanancia += sub;
  });
  t.fixed.forEach(it => {
    const v = val('v_'+f.template+'_'+it.key);
    items.push({ label: it.label, value: v });
    total += v;
  });
  let ganancia = 0;
  if (t.ganancia){
    const pct = val('v_'+f.template+'_ganancia');
    ganancia = (total - sinGanancia) * pct / 100;
    items.push({ label: t.ganancia.label + ' (' + pct + '%)', value: ganancia });
    total += ganancia;
  }
  return { area, items, total, ganancia };
}

function templateOptionsHTML(selected){
  return Object.keys(TEMPLATES).map(tkey =>
    `<option value="${tkey}" ${tkey===selected?'selected':''}>${TEMPLATES[tkey].label}</option>`
  ).join('');
}

function render(){
  const list = document.getElementById('frentes-list');
  list.innerHTML = '';
  frentes.forEach(f => {
    const t = TEMPLATES[f.template] || TEMPLATES.frente;
    const calc = calcularFrente(f);
    const card = document.createElement('div');
    card.className = 'frente-card';

    let medidasHTML = '';
    let qtyFieldsHTML = '';
    let totalInfoHTML = '';

    if (t.opciones){
      const opcionesHTML = t.opciones.map((op, i) =>
        `<option value="${i}" ${ (f.opcion||0) === i ? 'selected' : '' }>${op.label}</option>`
      ).join('');
      medidasHTML = `<div class="field" style="grid-column:1 / -1;"><label>Medida</label><select onchange="actualizarFrente(${f.id},'opcion',this.value)">${opcionesHTML}</select></div>`;
      totalInfoHTML = `<span class="label">${calc.items[0] ? calc.items[0].label : ''}</span><span class="val">${fmt(calc.total)}</span>`;
    } else {
      medidasHTML = `
        <div class="field"><label>Ancho (m)</label><input type="text" inputmode="decimal" placeholder="0,00" value="${mostrarNum(f.ancho)}" oninput="actualizarFrente(${f.id},'ancho',this.value)"></div>
        <div class="field"><label>Alto (m)</label><input type="text" inputmode="decimal" placeholder="0,00" value="${mostrarNum(f.alto)}" oninput="actualizarFrente(${f.id},'alto',this.value)"></div>
      `;
      t.perUnit.forEach(it => {
        qtyFieldsHTML += `<div class="field"><label>Cant. ${it.label}</label><input type="text" inputmode="numeric" placeholder="0" value="${mostrarNum(f[it.qty])}" oninput="actualizarFrente(${f.id},'${it.qty}',this.value)"></div>`;
      });
      totalInfoHTML = `<span class="label">Área: ${calc.area.toFixed(2).replace('.', ',')} m²</span><span class="val">${fmt(calc.total)}</span>`;
    }

    card.innerHTML = `
      <div class="tpl-row">
        <select onchange="cambiarTemplate(${f.id}, this.value)">${templateOptionsHTML(f.template)}</select>
      </div>
      <div class="frente-top">
        <input type="text" value="${f.desc}" oninput="actualizarFrente(${f.id},'desc',this.value)">
        <button class="btn-del" onclick="eliminarFrente(${f.id})">✕</button>
      </div>
      <div class="medidas-row">${medidasHTML}</div>
      <div class="cant-grid">${qtyFieldsHTML}</div>
      <div class="frente-total">${totalInfoHTML}</div>
      <div class="desglose-toggle" onclick="toggleDesglose(${f.id})" id="desglose-toggle-${f.id}">Ver detalle ▾</div>
      <div class="desglose" id="desglose-${f.id}" style="display:none">${desgloseHTML(calc)}</div>
    `;
    list.appendChild(card);
  });
  calcularTotales();
}

function desgloseHTML(calc){
  return calc.items.map(i => `${i.label}: <b>${fmt(i.value)}</b>`).join('<br>');
}

function toggleDesglose(id){
  const div = document.getElementById('desglose-'+id);
  const toggle = document.getElementById('desglose-toggle-'+id);
  const abierto = div.style.display !== 'none';
  div.style.display = abierto ? 'none' : 'block';
  toggle.textContent = abierto ? 'Ver detalle ▾' : 'Ocultar detalle ▴';
}

function calcularTotales(){
  let total = 0, ganancia = 0;
  frentes.forEach(f => { const c = calcularFrente(f); total += c.total; ganancia += c.ganancia || 0; });
  document.getElementById('total-general').textContent = fmt(total);
  document.getElementById('ganancia-general').textContent = ganancia ? 'Tu ganancia: ' + fmt(ganancia) : '';
  const cards = document.querySelectorAll('.frente-card');
  cards.forEach((card, i) => {
    const f = frentes[i];
    if (!f) return;
    const calc = calcularFrente(f);
    const valSpan = card.querySelector('.frente-total .val');
    const labelSpan = card.querySelector('.frente-total .label');
    if (valSpan) valSpan.textContent = fmt(calc.total);
    if (labelSpan){
      const t = TEMPLATES[f.template] || TEMPLATES.frente;
      labelSpan.textContent = t.opciones
        ? (calc.items[0] ? calc.items[0].label : '')
        : 'Área: ' + calc.area.toFixed(2).replace('.', ',') + ' m²';
    }
    const desgloseDiv = document.getElementById('desglose-'+f.id);
    if (desgloseDiv) desgloseDiv.innerHTML = desgloseHTML(calc);
  });
  guardarBorrador();
}

const DIAS_VALIDEZ = 10;
function proximoNumero(){
  try{ return parseInt(localStorage.getItem('nro-proximo'), 10) || 1; }catch(e){ return 1; }
}
function guardarProximoNumero(v){
  const n = parseInt(String(v).replace(/[^0-9]/g, ''), 10);
  if (n > 0){ try{ localStorage.setItem('nro-proximo', String(n)); }catch(e){} }
}
function tomarNumero(){
  const n = proximoNumero();
  try{ localStorage.setItem('nro-proximo', String(n + 1)); }catch(e){}

  if (campo) campo.value = n + 1;
  return n;
}
function formatoNumero(n){ return 'N° ' + String(n).padStart(4, '0'); }

// modo 'descargar': no abre el menú de compartir, baja el PDF directo.
// modo 'whatsapp': comparte el PDF junto con el mensaje armado para WhatsApp.
async function generarPDF(modo){
  const msg = document.getElementById('pdf-msg');
  if (!frentes.length){
    msg.textContent = 'Cargá al menos un frente antes de generar el PDF.';
    return;
  }
  const email = document.getElementById('pdf-email').value.trim();
  const emailValido = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
  if (email && !emailValido){
    msg.textContent = 'Ese email no parece válido. Revisalo.';
    document.getElementById('pdf-email').focus();
    return;
  }
  if (!window.jspdf){
    msg.textContent = 'Necesitás conexión a internet para generar el PDF.';
    return;
  }
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit:'mm', format:'a4' });
  const marginX = 14;
  const rightX = 196;
  let y = 18;

  if (logoDataUrl){
    try { doc.addImage(logoDataUrl, 'PNG', marginX, y-6, 18, 18); } catch(e){}
  }
  doc.setFont('helvetica','bold'); doc.setFontSize(15); doc.setTextColor(30,30,30);
  const numero = tomarNumero();
  doc.text('Presupuesto ' + formatoNumero(numero), marginX+24, y);
  doc.setFont('helvetica','normal'); doc.setFontSize(8.5); doc.setTextColor(120,120,120);
  const hoy = new Date();
  const fecha = hoy.toLocaleDateString('es-AR');
  const vence = new Date(hoy); vence.setDate(vence.getDate() + DIAS_VALIDEZ);
  const venceTexto = vence.toLocaleDateString('es-AR');
  doc.text('Válido por ' + DIAS_VALIDEZ + ' días (hasta el ' + venceTexto + ')', marginX+24, y+5);
  doc.text('Fecha: ' + fecha, rightX, y-2, { align:'right' });
  const cliente = document.getElementById('pdf-cliente').value.trim();
  let infoY = y + 4;
  if (cliente){
    doc.text('Cliente: ' + cliente, rightX, infoY, { align:'right' });
    infoY += 5.5;
  }
  if (email){
    doc.text('Email: ' + email, rightX, infoY, { align:'right' });
  }
  y += 20;
  doc.setDrawColor(217,118,43); doc.setLineWidth(0.8);
  doc.line(marginX, y, rightX, y);
  y += 7;

  // Ancho fijo de la columna de precio, igual en todas las tablas, para que
  // los precios queden siempre en la misma posición vertical (alineados).
  const anchoPrecio = 30;

  function lineaConPrecio(label, precioTexto, x, yy, opts){
    opts = opts || {};
    doc.text(label, x, yy);
    doc.text(precioTexto, rightX, yy, { align:'right' });
  }

  let grandTotal = 0;
  const groups = {};
  const order = [];
  frentes.forEach(f => {
    if (!groups[f.template]){ groups[f.template] = []; order.push(f.template); }
    groups[f.template].push(f);
  });

  // Para la recomendación consolidada (se muestra una sola vez, al final).
  let carboneroFalta = false, carboneroPrecio = 0;
  let cubierteroFalta = false, cubierteroPrecio = 0;

  order.forEach(tkey => {
    const t = TEMPLATES[tkey];
    doc.setFont('helvetica','bold'); doc.setFontSize(11); doc.setTextColor(30,30,30);
    doc.text(t.label, marginX, y);
    y += 3.5;

    const rows = groups[tkey].map(f => {
      const c = calcularFrente(f);
      grandTotal += c.total;
      if (t.opciones){
        return [f.desc || '-', c.items[0] ? c.items[0].label : '-', fmt(c.total)];
      }
      return [f.desc || '-', fmt(c.total)];
    });

    doc.autoTable({
      startY: y,
      margin: { left: marginX, right: 14 },
      head: t.opciones ? [['Descripción','Medida','Precio']] : [['Descripción','Precio']],
      body: rows,
      styles: { fontSize: 8.3, cellPadding: 2.2, valign: 'middle' },
      headStyles: { fillColor: [217,118,43], textColor: 255, fontStyle: 'bold' },
      columnStyles: t.opciones
        ? { 2: { halign:'right', cellWidth: anchoPrecio } }
        : { 1: { halign:'right', cellWidth: anchoPrecio } },
      theme: 'grid',
    });
    y = doc.lastAutoTable.finalY + 4;

    // "Agrego: ..." — pegado debajo de la tabla, un renglón por cada presupuesto
    // que tenga cajón carbonero y/o cubiertero, con el precio alineado a la derecha.
    // También suma a los contadores de la recomendación consolidada del final.
    groups[tkey].forEach(f => {
      const agregados = [];
      if ((f.carbonero||0) > 0){
        agregados.push({ label:'Agrego: cajón carbonero', val: val('v_'+f.template+'_carbonero') });
      } else if (!t.opciones){
        carboneroFalta = true;
        carboneroPrecio = carboneroPrecio || val('v_'+f.template+'_carbonero');
      }
      if ((f.cubiertero||0) > 0){
        agregados.push({ label:'Agrego: cajón cubiertero', val: val('v_'+f.template+'_cubiertero') });
      } else if (!t.opciones){
        cubierteroFalta = true;
        cubierteroPrecio = cubierteroPrecio || val('v_'+f.template+'_cubiertero');
      }
      if (!agregados.length) return;
      if (y > 282){ doc.addPage(); y = 20; }
      doc.setFont('helvetica','italic'); doc.setFontSize(7.6); doc.setTextColor(130,130,130);
      doc.text((f.desc || '-') + ':', marginX, y);
      y += 3.6;
      doc.setFont('helvetica','normal'); doc.setFontSize(8); doc.setTextColor(90,90,90);
      agregados.forEach(a => {
        if (y > 286){ doc.addPage(); y = 20; }
        lineaConPrecio(a.label, fmt(a.val), marginX + 3, y);
        y += 3.9;
      });
      y += 1;
    });
    y += 1.5;

    if (t.specs && t.specs.length){
      if (y > 268){ doc.addPage(); y = 20; }
      doc.setFont('helvetica','bold'); doc.setFontSize(9); doc.setTextColor(217,118,43);
      doc.text('Detalles técnicos', marginX, y);
      y += 4.5;
      doc.setFont('helvetica','normal'); doc.setFontSize(8); doc.setTextColor(70,70,70);
      t.specs.forEach(line => {
        const wrapped = doc.splitTextToSize('•  ' + line, rightX - marginX);
        wrapped.forEach(wl => {
          if (y > 288){ doc.addPage(); y = 20; }
          doc.text(wl, marginX, y);
          y += 4;
        });
      });
      y += 4;
    } else {
      y += 1.5;
    }
  });

  // Recomendación de venta — UNA sola vez para todo el presupuesto (no repetida
  // por cada tipo de producto), separada con una línea, más abajo.
  if (carboneroFalta || cubierteroFalta){
    if (y > 250){ doc.addPage(); y = 20; }
    y += 4;
    doc.setDrawColor(220,220,220); doc.setLineWidth(0.4);
    doc.line(marginX, y, rightX, y);
    y += 7;
    doc.setFont('helvetica','bolditalic'); doc.setFontSize(9.5); doc.setTextColor(217,118,43);
    doc.text('¿Querés agregarlo?', marginX, y);
    y += 5;
    doc.setFontSize(8.6);
    if (carboneroFalta){
      doc.setFont('helvetica','normal'); doc.setTextColor(70,70,70);
      const label = '•  Cajón carbonero: ';
      doc.text(label, marginX, y);
      doc.setFont('helvetica','bold'); doc.setTextColor(30,30,30);
      doc.text(fmt(carboneroPrecio), marginX + doc.getTextWidth(label), y);
      y += 4.4;
    }
    if (cubierteroFalta){
      doc.setFont('helvetica','normal'); doc.setTextColor(70,70,70);
      const label = '•  Cajón cubiertero: ';
      doc.text(label, marginX, y);
      doc.setFont('helvetica','bold'); doc.setTextColor(30,30,30);
      doc.text(fmt(cubierteroPrecio), marginX + doc.getTextWidth(label), y);
      y += 4.4;
    }
    doc.setFont('helvetica','bolditalic'); doc.setTextColor(217,118,43);
    doc.text('¡No te quedes sin el tuyo!', marginX, y);
    y += 7;
  }

  if (y > 278){ doc.addPage(); y = 20; }
  doc.setDrawColor(217,118,43); doc.setLineWidth(0.8);
  doc.line(marginX, y-4, rightX, y-4);
  doc.setFont('helvetica','bold'); doc.setFontSize(12.5); doc.setTextColor(30,30,30);
  doc.text('TOTAL: ' + fmt(grandTotal), rightX, y+3, { align:'right' });
  y += 13;

  // Condiciones comerciales
  if (y > 262){ doc.addPage(); y = 20; }
  const mitad = Math.round(grandTotal / 2);
  doc.setFont('helvetica','bold'); doc.setFontSize(10); doc.setTextColor(30,30,30);
  doc.text('Forma de pago', marginX, y);
  y += 5.5;
  doc.setFont('helvetica','normal'); doc.setFontSize(9); doc.setTextColor(60,60,60);
  doc.text('•  Seña del 50% al iniciar el trabajo: ' + fmt(mitad), marginX, y); y += 4.8;
  doc.text('•  50% restante al finalizar: ' + fmt(grandTotal - mitad), marginX, y); y += 4.8;
  const demora = doc.splitTextToSize('•  Una vez abonado, el trabajo tiene una demora de instalación de 30 días aproximadamente.', rightX - marginX);
  doc.text(demora, marginX, y); y += 4.8 * demora.length + 2.2;
  doc.setFontSize(8.5); doc.setTextColor(120,120,120);
  doc.text(doc.splitTextToSize('Presupuesto válido por ' + DIAS_VALIDEZ + ' días, hasta el ' + venceTexto + '. Pasada esa fecha, el valor podría modificarse.', rightX - marginX), marginX, y);

  const nombreArchivo = 'presupuesto-' + String(numero).padStart(4, '0') + (cliente ? '-'+cliente.replace(/\s+/g,'_') : '') + '.pdf';
  const pdfBlob = doc.output('blob');
  const pdfFile = new File([pdfBlob], nombreArchivo, { type: 'application/pdf' });

  let compartido = false;
  if (modo !== 'descargar' && navigator.canShare && navigator.canShare({ files: [pdfFile] })){
    try{
      await navigator.share({
        files: [pdfFile],
        title: 'Presupuesto',
        text: modo === 'whatsapp'
          ? textoWhatsApp(numero)
          : (cliente ? ('Presupuesto para ' + cliente) : 'Presupuesto')
      });
      compartido = true;
    }catch(e){
      // el usuario cancela el share, o el navegador lo rechaza: seguimos con la descarga
      compartido = false;
    }
  }
  if (!compartido){
    doc.save(nombreArchivo);
  }

  msg.textContent = compartido ? 'Listo ✓' : 'PDF descargado ✓';
  setTimeout(() => { msg.textContent = ''; }, 2500);

  if (historialHabilitado()){
    registrarEnHistorial(cliente, fecha, grandTotal, frentes.length, numero);
  }

  if (sheetsHabilitado()){
    enviarASheets(cliente, fecha, grandTotal, groups, order, numero);
  }
}

// ---------- WhatsApp ----------
// Número argentino a formato internacional para wa.me: 11 2345 6789 -> 5491123456789
function telWhatsApp(t){
  let d = String(t || '').replace(/[^0-9]/g, '');
  if (!d) return '';
  if (d.startsWith('00')) d = d.slice(2);
  if (d.startsWith('54')) return d;
  if (d.startsWith('0')) d = d.slice(1);
  // Con el 15 de celular escrito (11 15 2345 6789) quedan 12 dígitos: se lo saca.
  if (d.length === 12) d = d.replace(/^(\d{2,4})15/, '$1');
  return '549' + d;
}

function textoWhatsApp(numero){
  const cliente = document.getElementById('pdf-cliente').value.trim();
  let total = 0;
  const lineas = frentes.map(f => {
    const c = calcularFrente(f);
    total += c.total;
    return '• ' + (f.desc || TEMPLATES[f.template].label) + ': ' + fmt(c.total);
  });
  return (cliente ? 'Hola ' + cliente + '! ' : 'Hola! ') +
    'Te paso el presupuesto ' + formatoNumero(numero || proximoNumero()) + ' de Diseño & Alma:\n\n' +
    lineas.join('\n') + '\n\n*Total: ' + fmt(total) + '*\n\n' +
    'Seña del 50% al iniciar y 50% al finalizar. Válido por ' + DIAS_VALIDEZ + ' días.\n' +
    'Te adjunto el PDF con el detalle. Cualquier consulta, avisame.';
}

function enviarWhatsApp(){
  const msg = document.getElementById('pdf-msg');
  if (!frentes.length){
    msg.textContent = 'Cargá al menos un frente antes de enviarlo.';
    return;
  }
  // En el celular: se comparte el PDF con el mensaje y se elige WhatsApp
  // en el menú (un link de WhatsApp no puede llevar archivos adjuntos).
  const prueba = new File([''], 'presupuesto.pdf', { type: 'application/pdf' });
  if (navigator.canShare && navigator.canShare({ files: [prueba] })){
    msg.textContent = 'Elegí WhatsApp y después el contacto.';
    generarPDF('whatsapp');
    return;
  }
  // En la computadora: se abre el chat con el mensaje y se baja el PDF para adjuntarlo.
  const tel = telWhatsApp(document.getElementById('pdf-tel').value);
  const url = 'https://wa.me/' + tel + '?text=' + encodeURIComponent(textoWhatsApp());
  window.open(url, '_blank');
  generarPDF('descargar').then(() => {
    msg.textContent = 'PDF descargado ✓ Adjuntalo en el chat de WhatsApp.';
  });
}

// ---------- Google Calendar ----------
function agendarInstalacion(){
  const msg = document.getElementById('pdf-msg');
  const fecha = document.getElementById('inst-fecha').value;   // AAAA-MM-DD
  const hora = document.getElementById('inst-hora').value || '09:00';
  if (!fecha){
    msg.textContent = 'Elegí la fecha de instalación.';
    document.getElementById('inst-fecha').focus();
    return;
  }
  const cliente = document.getElementById('pdf-cliente').value.trim();
  const email = document.getElementById('pdf-email').value.trim();
  const tel = document.getElementById('pdf-tel').value.trim();
  const inicio = fecha.replace(/-/g, '') + 'T' + hora.replace(':', '') + '00';
  const d = new Date(fecha + 'T' + hora);
  d.setHours(d.getHours() + 3); // duración estimada: 3 horas
  const p2 = n => String(n).padStart(2, '0');
  const fin = d.getFullYear() + p2(d.getMonth()+1) + p2(d.getDate()) + 'T' + p2(d.getHours()) + p2(d.getMinutes()) + '00';

  let total = 0;
  const lineas = frentes.map(f => {
    const c = calcularFrente(f);
    total += c.total;
    return '• ' + (f.desc || TEMPLATES[f.template].label) + ': ' + fmt(c.total);
  });
  const detalle = [
    cliente ? 'Cliente: ' + cliente : '',
    tel ? 'WhatsApp: ' + tel : '',
    email ? 'Email: ' + email : '',
    '',
    ...lineas,
    'Total: ' + fmt(total)
  ].filter((l, i) => l || i === 3).join('\n');

  const url = 'https://calendar.google.com/calendar/render?action=TEMPLATE' +
    '&text=' + encodeURIComponent('Instalación' + (cliente ? ' – ' + cliente : '')) +
    '&dates=' + inicio + '/' + fin +
    '&ctz=America/Argentina/Buenos_Aires' +
    '&details=' + encodeURIComponent(detalle);
  window.open(url, '_blank');
}

// ---------- Conexión con Google Sheets (vía Apps Script) ----------
function sheetsHabilitado(){
  return document.getElementById('sheets-enabled').checked && !!document.getElementById('sheets-url').value.trim();
}

function guardarSheetsUrl(v){
  try{ localStorage.setItem('sheets-url', v.trim()); }catch(e){}
}

function onSheetsToggle(activado){
  try{ localStorage.setItem('sheets-enabled', activado ? '1' : '0'); }catch(e){}
}

function cargarConfigSheets(){
  try{
    const url = localStorage.getItem('sheets-url') || '';
    const activado = localStorage.getItem('sheets-enabled') === '1';
    document.getElementById('sheets-url').value = url;
    document.getElementById('sheets-enabled').checked = activado;
  }catch(e){}
}

async function enviarASheets(cliente, fecha, grandTotal, groups, order, numero){
  const msg = document.getElementById('sheets-msg');
  const url = document.getElementById('sheets-url').value.trim();
  if (!url) return;

  // Arma un resumen de descripciones por plantilla (Frente de parrilla / Bajo mesada)
  const resumen = {};
  order.forEach(tkey => {
    resumen[tkey] = groups[tkey].map(f => {
      const c = calcularFrente(f);
      const detalle = TEMPLATES[tkey].opciones
        ? (c.items[0] ? c.items[0].label : '')
        : c.area.toFixed(2) + ' m²';
      return (f.desc || TEMPLATES[tkey].label) + ' (' + detalle + ')';
    }).join('; ');
  });

  const payload = {
    fecha: fecha,
    cliente: cliente || 'Sin nombre',
    frente: resumen['frente'] || '',
    bajomesada: resumen['bajomesada'] || '',
    otro: resumen['parrillamodular'] || '',
    presupuesto: grandTotal,
    numero: numero,
    estado: 'Presupuesto enviado'
  };

  try{
    await fetch(url, {
      method: 'POST',
      mode: 'no-cors',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(payload)
    });
    if (msg) msg.textContent = 'Enviado a Sheets ✓';
  }catch(e){
    if (msg) msg.textContent = 'No se pudo enviar a Sheets';
  }
  if (msg) setTimeout(() => { msg.textContent = ''; }, 2500);
}

// ---------- Historial opcional (guardado en este dispositivo) ----------
let historial = [];

function historialHabilitado(){
  return document.getElementById('hist-enabled').checked;
}

function onHistToggle(activado){
  try{ localStorage.setItem('hist-enabled', activado ? '1' : '0'); }catch(e){}
  renderHistorial();
}

function cargarHistorial(){
  try{
    const activado = localStorage.getItem('hist-enabled') === '1';
    document.getElementById('hist-enabled').checked = activado;
    const raw = localStorage.getItem('historial');
    historial = raw ? JSON.parse(raw) : [];
  }catch(e){
    historial = [];
  }
  renderHistorial();
}

function guardarHistorialArray(){
  try{
    localStorage.setItem('historial', JSON.stringify(historial));
    return true;
  }catch(e){
    return false;
  }
}

function registrarEnHistorial(cliente, fecha, total, cantFrentes, numero){
  historial.unshift({
    id: Date.now(),
    numero,
    fecha,
    cliente: cliente || 'Sin nombre',
    total,
    cantFrentes,
    // Para armar el evento de Calendar si después lo acepta.
    tel: document.getElementById('pdf-tel').value.trim(),
    email: document.getElementById('pdf-email').value.trim(),
    lineas: frentes.map(f => '• ' + (f.desc || TEMPLATES[f.template].label) + ': ' + fmt(calcularFrente(f).total)),
    estado: 'pendiente'
  });
  guardarHistorialArray();
  renderHistorial();
}

function eliminarHistorialItem(id){
  if (!confirm('¿Borrar este presupuesto del historial?')) return;
  historial = historial.filter(h => h.id !== id);
  guardarHistorialArray();
  renderHistorial();
}

function renderHistorial(){
  const cont = document.getElementById('historial-list');
  if (!historialHabilitado()){
    cont.innerHTML = '<div class="hist-empty">Activá la opción de arriba para empezar a guardar.</div>';
    return;
  }
  if (!historial.length){
    cont.innerHTML = '<div class="hist-empty">Todavía no generaste ningún presupuesto.</div>';
    return;
  }
  cont.innerHTML = '';
  historial.forEach(h => {
    const estado = h.estado || 'pendiente';
    const item = document.createElement('div');
    item.className = 'hist-item ' + estado;
    const etiqueta = estado === 'aceptado' ? '✓ Aceptado' + (h.fechaAceptado ? ' el ' + fechaCorta(h.fechaAceptado) : '')
      : estado === 'rechazado' ? '✗ No aceptado' : 'Pendiente · tocá para marcar';
    let panel = '';
    if (histAbiertos.has(h.id)){
      panel = `
        <div class="hist-panel">
          <div class="hist-acciones">
            <button class="${estado === 'aceptado' ? 'on-ok' : ''}" onclick="marcarHistorial(${h.id},'aceptado')">✓ Aceptó presupuesto</button>
            <button class="${estado === 'rechazado' ? 'on-no' : ''}" onclick="marcarHistorial(${h.id},'rechazado')">✗ No aceptó</button>
          </div>
          ${estado === 'aceptado' ? `
          <div class="hist-entrega">
            Entrega estimada (30 días desde que aceptó):
            <input type="date" value="${h.fechaEntrega || ''}" onchange="cambiarEntrega(${h.id}, this.value)">
            <button class="btn-sec" onclick="agendarEntrega(${h.id})">Agendar en Google Calendar</button>
          </div>` : ''}
          ${h.sheetsMsg ? `<div class="hist-entrega">${h.sheetsMsg}</div>` : ''}
        </div>`;
    }
    item.innerHTML = `
      <div class="info" onclick="toggleHistorial(${h.id})">
        <div class="cliente">${h.cliente}</div>
        <div class="meta">${h.numero ? formatoNumero(h.numero) + ' · ' : ''}${h.fecha} · ${h.cantFrentes} ítem(s)</div>
        <span class="hist-estado">${etiqueta}</span>
      </div>
      <div class="total">${fmt(h.total)}</div>
      <button class="btn-del" onclick="eliminarHistorialItem(${h.id})">✕</button>
      ${panel}
    `;
    cont.appendChild(item);
  });
}

// ---------- Estado de cada presupuesto del historial ----------
const histAbiertos = new Set();
const p2 = n => String(n).padStart(2, '0');
function isoLocal(d){ return d.getFullYear() + '-' + p2(d.getMonth()+1) + '-' + p2(d.getDate()); }
function fechaCorta(iso){ const [a, m, d] = iso.split('-'); return d + '/' + m + '/' + a; }

function toggleHistorial(id){
  if (histAbiertos.has(id)) histAbiertos.delete(id); else histAbiertos.add(id);
  renderHistorial();
}

function marcarHistorial(id, estado){
  const h = historial.find(x => x.id === id);
  if (!h) return;
  const estabaAceptado = h.estado === 'aceptado';
  if (h.estado === estado){
    h.estado = 'pendiente';   // tocar de nuevo el mismo botón lo desmarca
  } else {
    h.estado = estado;
    if (estado === 'aceptado'){
      const hoy = new Date();
      h.fechaAceptado = isoLocal(hoy);
      const entrega = new Date(hoy);
      entrega.setDate(entrega.getDate() + 30);
      h.fechaEntrega = isoLocal(entrega);
    }
  }
  // En la planilla: aceptar = el trabajo pasa a Trabajos con la seña del 50%;
  // no aceptó / desmarcar = queda así en Presupuestos (y sale de Trabajos).
  avisarSheetsEstado(h, h.estado, estabaAceptado);
  guardarHistorialArray();
  renderHistorial();
}

// Le avisa al Apps Script de la planilla el estado del presupuesto
// ('aceptado', 'rechazado' o 'pendiente'). El script lo busca por número
// (o por cliente y monto en los presupuestos viejos sin número).
async function avisarSheetsEstado(h, accion, estabaAceptado){
  if (!sheetsHabilitado()) return;
  const url = document.getElementById('sheets-url').value.trim();
  const payload = {
    accion,
    cliente: h.cliente,
    presupuesto: h.total,
    numero: h.numero || '',
    adelanto: accion === 'aceptado' ? Math.round(h.total / 2) : 0,
    plazoEntrega: accion === 'aceptado' && h.fechaEntrega ? fechaCorta(h.fechaEntrega) : '',
    fechaAceptado: accion === 'aceptado' && h.fechaAceptado ? h.fechaAceptado : '',
    estabaAceptado: !!estabaAceptado
  };
  try{
    await fetch(url, {
      method: 'POST',
      mode: 'no-cors',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(payload)
    });
    h.sheetsMsg = accion === 'aceptado' ? 'Pasado a Trabajos con la seña del 50% ✓'
      : accion === 'rechazado' ? 'Marcado como no aceptado en tu planilla ✓'
      : 'Actualizado en tu planilla ✓';
  }catch(e){
    h.sheetsMsg = 'No se pudo avisar a la planilla (¿sin internet?)';
  }
  renderHistorial();
}

function cambiarEntrega(id, valor){
  const h = historial.find(x => x.id === id);
  if (!h) return;
  h.fechaEntrega = valor;
  guardarHistorialArray();
  if (h.estado === 'aceptado') avisarSheetsEstado(h, 'aceptado');
}

// Evento de día completo en la fecha de entrega estimada.
function agendarEntrega(id){
  const h = historial.find(x => x.id === id);
  if (!h || !h.fechaEntrega) return;
  const dia = new Date(h.fechaEntrega + 'T12:00');
  const sig = new Date(dia); sig.setDate(sig.getDate() + 1);
  const ymd = d => isoLocal(d).replace(/-/g, '');
  const contacto = ['Cliente: ' + h.cliente];
  if (h.tel) contacto.push('WhatsApp: ' + h.tel);
  if (h.email) contacto.push('Email: ' + h.email);
  contacto.push('Presupuesto ' + (h.numero ? formatoNumero(h.numero) + ' ' : '') + 'del ' + h.fecha + (h.fechaAceptado ? ', aceptado el ' + fechaCorta(h.fechaAceptado) : ''));
  const detalle = contacto.join('\n') + '\n\n' + [...(h.lineas || []), 'Total: ' + fmt(h.total)].join('\n');
  const url = 'https://calendar.google.com/calendar/render?action=TEMPLATE' +
    '&text=' + encodeURIComponent('Entrega estimada – ' + h.cliente) +
    '&dates=' + ymd(dia) + '/' + ymd(sig) +
    '&ctz=America/Argentina/Buenos_Aires' +
    '&details=' + encodeURIComponent(detalle);
  window.open(url, '_blank');
}
