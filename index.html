<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calculadora de frente de parrilla</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#24272B">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<style>
  :root{
    --bg: #24272B;
    --panel: #2E3237;
    --panel-2: #383D43;
    --line: #454B52;
    --text: #EDEAE3;
    --text-dim: #A7ADB4;
    --ember: #D9762B;
    --ember-dim: #8C5527;
    --steel: #5B7A93;
    --ok: #7BAE7F;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif;
  }
  .wrap {
    max-width: 640px;
    margin: 0 auto;
    padding: 18px 14px 110px;
  }
  header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    border-bottom: 2px solid var(--ember);
    padding-bottom: 10px;
    margin-bottom: 18px;
  }
  header .titles { display: flex; flex-direction: column; }
  header h1 {
    font-family: 'Oswald', 'Segoe UI', sans-serif;
    font-size: 1.3rem;
    letter-spacing: 0.02em;
    margin: 0;
    text-transform: uppercase;
  }
  header span { font-size: 0.7rem; color: var(--text-dim); }
  header .logo {
    width: 42px;
    height: 42px;
    border-radius: 50%;
    object-fit: cover;
    border: 1px solid var(--line);
    flex-shrink: 0;
    margin-left: 10px;
  }
  .section {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 4px;
    margin-bottom: 14px;
    overflow: hidden;
  }
  .section-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 14px;
    background: var(--panel-2);
    cursor: pointer;
    user-select: none;
  }
  .section-head h2 {
    font-family: 'Oswald', 'Segoe UI', sans-serif;
    font-size: 0.85rem;
    letter-spacing: 0.03em;
    text-transform: uppercase;
    margin: 0;
    color: var(--text-dim);
  }
  .chevron { transition: transform 0.15s ease; color: var(--text-dim); font-size: 0.8rem; }
  .chevron.open { transform: rotate(90deg); }
  .section-body {
    padding: 12px 14px 14px;
    display: none;
  }
  .section-body.open { display: block; }
  .valores-grid {
    display: grid;
    grid-template-columns: 1fr 100px;
    gap: 8px 10px;
    align-items: center;
    margin-bottom: 6px;
  }
  .valores-grid label {
    font-size: 0.82rem;
    color: var(--text-dim);
  }
  .valores-grid input {
    width: 100%;
  }
  .template-block-title {
    font-family: 'Oswald', 'Segoe UI', sans-serif;
    font-size: 0.78rem;
    letter-spacing: 0.03em;
    text-transform: uppercase;
    color: var(--ember);
    margin: 14px 0 6px;
  }
  .template-block-title:first-child { margin-top: 0; }
  .subgroup-title {
    grid-column: 1 / -1;
    font-size: 0.68rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--text-dim);
    margin-top: 8px;
    padding-top: 8px;
    border-top: 1px dashed var(--line);
  }
  .subgroup-title:first-child { border-top: none; margin-top: 0; padding-top: 0; }

  input[type=number], input[type=text] {
    background: var(--bg);
    border: 1px solid var(--line);
    color: var(--text);
    padding: 7px 8px;
    border-radius: 3px;
    font-size: 0.9rem;
  }
  input[type=number]:focus, input[type=text]:focus {
    outline: none;
    border-color: var(--ember);
  }
  select {
    background: var(--bg);
    border: 1px solid var(--line);
    color: var(--text);
    padding: 7px 8px;
    border-radius: 3px;
    font-size: 0.85rem;
  }

  .frente-card {
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-left: 3px solid var(--steel);
    border-radius: 3px;
    padding: 12px;
    margin-bottom: 10px;
  }
  .frente-top {
    display: flex;
    gap: 8px;
    margin-bottom: 10px;
    align-items: center;
  }
  .frente-top input[type=text] {
    flex: 1;
  }
  .btn-del {
    background: transparent;
    border: 1px solid var(--line);
    color: var(--text-dim);
    border-radius: 3px;
    width: 30px;
    height: 30px;
    font-size: 0.9rem;
    cursor: pointer;
    flex-shrink: 0;
  }
  .btn-del:active { border-color: var(--ember); color: var(--ember); }

  .tpl-row { margin-bottom: 10px; }
  .tpl-row select { width: 100%; }

  .medidas-row, .cant-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 8px;
    margin-bottom: 8px;
  }
  .field label {
    display: block;
    font-size: 0.68rem;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 0.03em;
    margin-bottom: 3px;
  }
  .field input { width: 100%; }

  .frente-total {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-top: 10px;
    padding-top: 10px;
    border-top: 1px dashed var(--line);
  }
  .frente-total .label { font-size: 0.75rem; color: var(--text-dim); }
  .frente-total .val { font-family: 'Oswald', sans-serif; font-size: 1.05rem; color: var(--ember); }

  .btn-add-row { display: flex; gap: 8px; margin-top: 4px; }
  .btn-add {
    flex: 1;
    display: block;
    background: transparent;
    border: 1px dashed var(--steel);
    color: var(--steel);
    padding: 10px;
    border-radius: 3px;
    font-size: 0.8rem;
    cursor: pointer;
  }
  .btn-add:active { border-color: var(--ember); color: var(--ember); }

  .total-bar {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    background: var(--panel-2);
    border-top: 2px solid var(--ember);
    padding: 12px 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .total-bar .lbl {
    font-size: 0.78rem;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }
  .total-bar .amt {
    font-family: 'Oswald', sans-serif;
    font-size: 1.5rem;
    color: var(--ember);
  }
  .desglose {
    font-size: 0.72rem;
    color: var(--text-dim);
    margin-top: 8px;
    line-height: 1.7;
    border-top: 1px dashed var(--line);
    padding-top: 8px;
  }
  .desglose b { color: var(--text); }
  .desglose-toggle {
    font-size: 0.7rem;
    color: var(--steel);
    margin-top: 8px;
    cursor: pointer;
    user-select: none;
  }
  .desglose-toggle:active { color: var(--ember); }

  .field.full { margin-bottom: 10px; }
  .btn-pdf {
    display: block;
    width: 100%;
    background: var(--ember-dim);
    border: 1px solid var(--ember);
    color: var(--text);
    padding: 10px;
    border-radius: 3px;
    font-size: 0.85rem;
    cursor: pointer;
  }
  .btn-pdf:active { background: var(--ember); }
  .pdf-msg { font-size: 0.72rem; color: var(--text-dim); margin-top: 8px; min-height: 1em; }

  .hist-toggle-row {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 0.8rem;
    color: var(--text-dim);
    margin-bottom: 10px;
    cursor: pointer;
  }
  .hist-toggle-row input { width: 16px; height: 16px; flex-shrink: 0; }
  .hist-item {
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-left: 3px solid var(--ember-dim);
    border-radius: 3px;
    padding: 10px 12px;
    margin-bottom: 8px;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 8px;
  }
  .hist-item .info { flex: 1; min-width: 0; }
  .hist-item .cliente { font-size: 0.88rem; color: var(--text); }
  .hist-item .meta { font-size: 0.68rem; color: var(--text-dim); margin-top: 2px; }
  .hist-item .total { font-family: 'Oswald', sans-serif; font-size: 0.95rem; color: var(--ember); white-space: nowrap; }
  .hist-empty { font-size: 0.78rem; color: var(--text-dim); padding: 8px 0; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="titles">
      <h1>Frente de parrilla</h1>
      <span>calculadora</span>
    </div>
    <img class="logo" src="logo.png" alt="Diseño &amp; Alma">
  </header>

  <div class="section" id="sec-valores">
    <div class="section-head" onclick="toggleSection('sec-valores')">
      <h2>Valores base</h2>
      <span class="chevron" id="chev-sec-valores">▶</span>
    </div>
    <div class="section-body" id="body-sec-valores">
      <div id="valores-container"></div>
    </div>
  </div>

  <div class="section" id="sec-frentes">
    <div class="section-head" onclick="toggleSection('sec-frentes')">
      <h2>Frentes cargados</h2>
      <span class="chevron open" id="chev-sec-frentes">▶</span>
    </div>
    <div class="section-body open" id="body-sec-frentes">
      <div id="frentes-list"></div>
      <div class="btn-add-row">
        <button class="btn-add" onclick="agregarFrente('frente')">+ Frente de parrilla</button>
        <button class="btn-add" onclick="agregarFrente('bajomesada')">+ Bajo mesada</button>
      </div>
    </div>
  </div>

  <div class="section" id="sec-pdf">
    <div class="section-head" onclick="toggleSection('sec-pdf')">
      <h2>Generar presupuesto (PDF)</h2>
      <span class="chevron open" id="chev-sec-pdf">▶</span>
    </div>
    <div class="section-body open" id="body-sec-pdf">
      <div class="field full"><label>Cliente (opcional)</label><input type="text" id="pdf-cliente" placeholder="Nombre del cliente"></div>
      <button class="btn-pdf" onclick="generarPDF()">Generar PDF para el cliente</button>
      <div class="pdf-msg" id="pdf-msg"></div>
    </div>
  </div>

  <div class="section" id="sec-historial">
    <div class="section-head" onclick="toggleSection('sec-historial')">
      <h2>Historial</h2>
      <span class="chevron" id="chev-sec-historial">▶</span>
    </div>
    <div class="section-body" id="body-sec-historial">
      <label class="hist-toggle-row">
        <input type="checkbox" id="hist-enabled" onchange="onHistToggle(this.checked)">
        Guardar en este celular cada presupuesto que genere
      </label>
      <div id="historial-list"></div>
    </div>
  </div>
</div>

<div class="total-bar">
  <span class="lbl">Total</span>
  <span class="amt" id="total-general">$0</span>
</div>

<script>
// ---------- Config de plantillas ----------
const TEMPLATES = {
  frente: {
    label: 'Frente de Parrilla',
    perM2: [
      { key:'valor1', label:'Chapa y plegado', def:160000 },
      { key:'valor2', label:'Pintura', def:52000 },
    ],
    perUnit: [
      { key:'bisagra', label:'Bisagra', def:20000, qty:'bisagras' },
      { key:'kit', label:'Kit', def:170000, qty:'kit' },
      { key:'carbonero', label:'Carbonero', def:250000, qty:'carbonero' },
      { key:'cubiertero', label:'Cubiertero', def:180000, qty:'cubiertero' },
    ],
    fixed: [
      { key:'comision', label:'Comisión', def:70000 },
      { key:'logistica', label:'Logística', def:80000 },
      { key:'manoobra', label:'Mano de obra', def:650000 },
    ]
  },
  bajomesada: {
    label: 'Bajo Mesada',
    perM2: [
      { key:'valor1', label:'Chapa', def:150000 },
      { key:'valor2', label:'Pintura', def:42000 },
    ],
    perUnit: [
      { key:'bisagra', label:'Bisagra', def:15000, qty:'bisagras' },
      { key:'kit', label:'Kit', def:10000, qty:'kit' },
    ],
    fixed: [
      { key:'manoobra', label:'Mano de obra', def:150000 },
      { key:'instalacion', label:'Instalación', def:100000 },
    ]
  }
};

let frentes = [];
let nextId = 1;

function toggleSection(id){
  document.getElementById('body-'+id).classList.toggle('open');
  document.getElementById('chev-'+id).classList.toggle('open');
}

function fmt(n){
  return '$' + Math.round(n).toLocaleString('es-AR');
}

function val(id){
  const el = document.getElementById(id);
  return el ? (parseFloat(el.value) || 0) : 0;
}

// ---------- Construir "Valores base" dinámicamente a partir de TEMPLATES ----------
function buildValoresBaseHTML(){
  let html = '';
  Object.keys(TEMPLATES).forEach(tkey => {
    const t = TEMPLATES[tkey];
    html += `<div class="template-block-title">${t.label}</div><div class="valores-grid">`;
    html += `<div class="subgroup-title">Por m²</div>`;
    t.perM2.forEach(it => {
      html += `<label>${it.label}</label><input type="number" id="v_${tkey}_${it.key}" value="${it.def}">`;
    });
    html += `<div class="subgroup-title">Por unidad</div>`;
    t.perUnit.forEach(it => {
      html += `<label>${it.label}</label><input type="number" id="v_${tkey}_${it.key}" value="${it.def}">`;
    });
    html += `<div class="subgroup-title">Fijos (por frente)</div>`;
    t.fixed.forEach(it => {
      html += `<label>${it.label}</label><input type="number" id="v_${tkey}_${it.key}" value="${it.def}">`;
    });
    html += `</div>`;
  });
  document.getElementById('valores-container').innerHTML = html;
  document.querySelectorAll('#valores-container input').forEach(inp => {
    inp.addEventListener('input', calcularTotales);
  });
}

function agregarFrente(template){
  frentes.push({
    id: nextId++,
    desc: TEMPLATES[template].label + ' ' + nextId,
    template: template,
    ancho: 0, alto: 0,
    bisagras: 0, kit: 0, carbonero: 0, cubiertero: 0
  });
  render();
}

function eliminarFrente(id){
  frentes = frentes.filter(f => f.id !== id);
  render();
}

function actualizarFrente(id, campo, valor){
  const f = frentes.find(f => f.id === id);
  if (!f) return;
  f[campo] = campo === 'desc' ? valor : (parseFloat(valor) || 0);
  calcularTotales();
}

function cambiarTemplate(id, nuevoTemplate){
  const f = frentes.find(f => f.id === id);
  if (!f) return;
  f.template = nuevoTemplate;
  render();
}

function calcularFrente(f){
  const t = TEMPLATES[f.template] || TEMPLATES.frente;
  const area = (f.ancho||0) * (f.alto||0);
  let total = 0;
  const items = [];
  t.perM2.forEach(it => {
    const v = val('v_'+f.template+'_'+it.key);
    const sub = area * v;
    items.push({ label: it.label, value: sub });
    total += sub;
  });
  t.perUnit.forEach(it => {
    const qty = f[it.qty] || 0;
    const v = val('v_'+f.template+'_'+it.key);
    const sub = qty * v;
    items.push({ label: it.label, value: sub });
    total += sub;
  });
  t.fixed.forEach(it => {
    const v = val('v_'+f.template+'_'+it.key);
    items.push({ label: it.label, value: v });
    total += v;
  });
  return { area, items, total };
}

function templateOptionsHTML(selected){
  return Object.keys(TEMPLATES).map(tkey =>
    `<option value="${tkey}" ${tkey===selected?'selected':''}>${TEMPLATES[tkey].label}</option>`
  ).join('');
}

function render(){
  const list = document.getElementById('frentes-list');
  list.innerHTML = '';
  frentes.forEach(f => {
    const t = TEMPLATES[f.template] || TEMPLATES.frente;
    const calc = calcularFrente(f);
    const card = document.createElement('div');
    card.className = 'frente-card';

    let qtyFieldsHTML = '';
    t.perUnit.forEach(it => {
      qtyFieldsHTML += `<div class="field"><label>Cant. ${it.label}</label><input type="number" value="${f[it.qty]||''}" oninput="actualizarFrente(${f.id},'${it.qty}',this.value)"></div>`;
    });

    card.innerHTML = `
      <div class="tpl-row">
        <select onchange="cambiarTemplate(${f.id}, this.value)">${templateOptionsHTML(f.template)}</select>
      </div>
      <div class="frente-top">
        <input type="text" value="${f.desc}" oninput="actualizarFrente(${f.id},'desc',this.value)">
        <button class="btn-del" onclick="eliminarFrente(${f.id})">✕</button>
      </div>
      <div class="medidas-row">
        <div class="field"><label>Ancho (m)</label><input type="number" step="0.01" value="${f.ancho||''}" oninput="actualizarFrente(${f.id},'ancho',this.value)"></div>
        <div class="field"><label>Alto (m)</label><input type="number" step="0.01" value="${f.alto||''}" oninput="actualizarFrente(${f.id},'alto',this.value)"></div>
      </div>
      <div class="cant-grid">${qtyFieldsHTML}</div>
      <div class="frente-total">
        <span class="label">Área: ${calc.area.toFixed(2)} m²</span>
        <span class="val">${fmt(calc.total)}</span>
      </div>
      <div class="desglose-toggle" onclick="toggleDesglose(${f.id})" id="desglose-toggle-${f.id}">Ver detalle ▾</div>
      <div class="desglose" id="desglose-${f.id}" style="display:none">${desgloseHTML(calc)}</div>
    `;
    list.appendChild(card);
  });
  calcularTotales();
}

function desgloseHTML(calc){
  return calc.items.map(i => `${i.label}: <b>${fmt(i.value)}</b>`).join('<br>');
}

function toggleDesglose(id){
  const div = document.getElementById('desglose-'+id);
  const toggle = document.getElementById('desglose-toggle-'+id);
  const abierto = div.style.display !== 'none';
  div.style.display = abierto ? 'none' : 'block';
  toggle.textContent = abierto ? 'Ver detalle ▾' : 'Ocultar detalle ▴';
}

function calcularTotales(){
  let total = 0;
  frentes.forEach(f => { total += calcularFrente(f).total; });
  document.getElementById('total-general').textContent = fmt(total);
  const cards = document.querySelectorAll('.frente-card');
  cards.forEach((card, i) => {
    const f = frentes[i];
    if (!f) return;
    const calc = calcularFrente(f);
    const valSpan = card.querySelector('.frente-total .val');
    const labelSpan = card.querySelector('.frente-total .label');
    if (valSpan) valSpan.textContent = fmt(calc.total);
    if (labelSpan) labelSpan.textContent = 'Área: ' + calc.area.toFixed(2) + ' m²';
    const desgloseDiv = document.getElementById('desglose-'+f.id);
    if (desgloseDiv) desgloseDiv.innerHTML = desgloseHTML(calc);
  });
}

// ---------- PDF para el cliente (sin precios de insumos ni mano de obra) ----------
let logoDataUrl = null;
async function preloadLogo(){
  try{
    const res = await fetch('logo.png');
    const blob = await res.blob();
    logoDataUrl = await new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result);
      reader.onerror = reject;
      reader.readAsDataURL(blob);
    });
  }catch(e){
    logoDataUrl = null;
  }
}

async function generarPDF(){
  const msg = document.getElementById('pdf-msg');
  if (!frentes.length){
    msg.textContent = 'Cargá al menos un frente antes de generar el PDF.';
    return;
  }
  if (!window.jspdf){
    msg.textContent = 'Necesitás conexión a internet para generar el PDF.';
    return;
  }
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit:'mm', format:'a4' });
  const marginX = 14;
  const rightX = 196;
  let y = 18;

  if (logoDataUrl){
    try { doc.addImage(logoDataUrl, 'PNG', marginX, y-6, 18, 18); } catch(e){}
  }
  doc.setFont('helvetica','bold'); doc.setFontSize(16); doc.setTextColor(30,30,30);
  doc.text('Presupuesto', marginX+24, y);
  doc.setFont('helvetica','normal'); doc.setFontSize(9); doc.setTextColor(120,120,120);
  const fecha = new Date().toLocaleDateString('es-AR');
  doc.text('Fecha: ' + fecha, rightX, y-2, { align:'right' });
  const cliente = document.getElementById('pdf-cliente').value.trim();
  if (cliente){
    doc.text('Cliente: ' + cliente, rightX, y+4, { align:'right' });
  }
  y += 18;
  doc.setDrawColor(217,118,43); doc.setLineWidth(0.8);
  doc.line(marginX, y, rightX, y);
  y += 8;

  let grandTotal = 0;
  const groups = {};
  const order = [];
  frentes.forEach(f => {
    if (!groups[f.template]){ groups[f.template] = []; order.push(f.template); }
    groups[f.template].push(f);
  });

  order.forEach(tkey => {
    const t = TEMPLATES[tkey];
    doc.setFont('helvetica','bold'); doc.setFontSize(12); doc.setTextColor(30,30,30);
    doc.text(t.label, marginX, y);
    y += 4;

    const rows = groups[tkey].map(f => {
      const c = calcularFrente(f);
      grandTotal += c.total;
      return [f.desc || '-', (f.ancho||0).toFixed(2)+' m', (f.alto||0).toFixed(2)+' m', c.area.toFixed(2)+' m²', fmt(c.total)];
    });

    doc.autoTable({
      startY: y,
      margin: { left: marginX, right: 14 },
      head: [['Descripción','Ancho','Alto','Área','Precio']],
      body: rows,
      styles: { fontSize: 9, cellPadding: 2.6 },
      headStyles: { fillColor: [217,118,43], textColor: 255 },
      theme: 'grid',
    });
    y = doc.lastAutoTable.finalY + 10;
  });

  doc.setDrawColor(217,118,43); doc.setLineWidth(0.8);
  doc.line(marginX, y-4, rightX, y-4);
  doc.setFont('helvetica','bold'); doc.setFontSize(13); doc.setTextColor(30,30,30);
  doc.text('TOTAL: ' + fmt(grandTotal), rightX, y+3, { align:'right' });

  const nombreArchivo = 'presupuesto' + (cliente ? '-'+cliente.replace(/\s+/g,'_') : '') + '.pdf';
  const pdfBlob = doc.output('blob');
  const pdfFile = new File([pdfBlob], nombreArchivo, { type: 'application/pdf' });

  let compartido = false;
  if (navigator.canShare && navigator.canShare({ files: [pdfFile] })){
    try{
      await navigator.share({
        files: [pdfFile],
        title: 'Presupuesto',
        text: cliente ? ('Presupuesto para ' + cliente) : 'Presupuesto'
      });
      compartido = true;
    }catch(e){
      // el usuario cancela el share, o el navegador lo rechaza: seguimos con la descarga
      compartido = false;
    }
  }
  if (!compartido){
    doc.save(nombreArchivo);
  }

  msg.textContent = compartido ? 'Listo ✓' : 'PDF descargado ✓';
  setTimeout(() => { msg.textContent = ''; }, 2500);

  if (historialHabilitado()){
    registrarEnHistorial(cliente, fecha, grandTotal, frentes.length);
  }
}

// ---------- Historial opcional (guardado en este dispositivo) ----------
let historial = [];

function historialHabilitado(){
  return document.getElementById('hist-enabled').checked;
}

function onHistToggle(activado){
  try{ localStorage.setItem('hist-enabled', activado ? '1' : '0'); }catch(e){}
  renderHistorial();
}

function cargarHistorial(){
  try{
    const activado = localStorage.getItem('hist-enabled') === '1';
    document.getElementById('hist-enabled').checked = activado;
    const raw = localStorage.getItem('historial');
    historial = raw ? JSON.parse(raw) : [];
  }catch(e){
    historial = [];
  }
  renderHistorial();
}

function guardarHistorialArray(){
  try{
    localStorage.setItem('historial', JSON.stringify(historial));
    return true;
  }catch(e){
    return false;
  }
}

function registrarEnHistorial(cliente, fecha, total, cantFrentes){
  historial.unshift({
    id: Date.now(),
    fecha,
    cliente: cliente || 'Sin nombre',
    total,
    cantFrentes
  });
  guardarHistorialArray();
  renderHistorial();
}

function eliminarHistorialItem(id){
  historial = historial.filter(h => h.id !== id);
  guardarHistorialArray();
  renderHistorial();
}

function renderHistorial(){
  const cont = document.getElementById('historial-list');
  if (!historialHabilitado()){
    cont.innerHTML = '<div class="hist-empty">Activá la opción de arriba para empezar a guardar.</div>';
    return;
  }
  if (!historial.length){
    cont.innerHTML = '<div class="hist-empty">Todavía no generaste ningún presupuesto.</div>';
    return;
  }
  cont.innerHTML = '';
  historial.forEach(h => {
    const item = document.createElement('div');
    item.className = 'hist-item';
    item.innerHTML = `
      <div class="info">
        <div class="cliente">${h.cliente}</div>
        <div class="meta">${h.fecha} · ${h.cantFrentes} ítem(s)</div>
      </div>
      <div class="total">${fmt(h.total)}</div>
      <button class="btn-del" onclick="eliminarHistorialItem(${h.id})">✕</button>
    `;
    cont.appendChild(item);
  });
}

// ---------- inicio ----------
buildValoresBaseHTML();
agregarFrente('frente');
preloadLogo();
cargarHistorial();

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("service-worker.js").catch(() => {});
  });
}
